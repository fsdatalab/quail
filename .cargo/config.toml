# lld links the DataFusion-sized test binaries and Python module several
# times faster than the system linker
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# pyo3 builds against the project's Python, the one an embedded
# interpreter loads Quail from. Forced, because maturin otherwise passes
# the path of a fresh build environment on every install, which makes
# pyo3 and every crate above it rebuild.
[env]
PYO3_PYTHON = { value = ".venv/bin/python", relative = true, force = true }
