name: Feature or performance request
description: Propose a feature, model, GPU spec, or performance improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: Describe the use case, workload, or bottleneck (include timings if performance-related).
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired API, SQL syntax, model/device spec, or optimization.
    validations:
      required: true
