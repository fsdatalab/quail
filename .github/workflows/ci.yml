name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # quailb (the QUAIL-B benchmark) installs from the private
      # fsdatalab/quail-bench repository; the default Actions token
      # cannot read it, so QUAILB_TOKEN is a fine-grained token with
      # read access to that repository's contents
      - name: Authorize the quail-bench repository
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.QUAILB_TOKEN }}@github.com/".insteadOf
          "https://github.com/"
      # uv sync builds the project's Rust module, _quail_native
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml links Linux builds with clang and lld
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      # an editable install builds the dev profile; cargo test then
      # reuses its compiled dependencies
      - run: uv sync --frozen
      - run: uv run --frozen python -c "import _quail_native"
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test
      - name: Lint (ruff)
        run: uv run --frozen ruff check quail bench calibrate tests experiments tools
      - name: Long string literals
        run: uv run --frozen python tools/check_long_strings.py
      - name: Names (check_names)
        run: uv run --frozen python tools/check_names.py
      - name: Dead code (vulture)
        run: uv run --frozen vulture
      - name: Import direction (import-linter)
        run: uv run --frozen lint-imports
      - name: Tests
        run: uv run --frozen pytest -q
