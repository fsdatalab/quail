name: CI

# CI runs on every push to main, so each merge is tested. On a pull
# request it runs when asked: add the label `run-ci` (remove and add it
# again to rerun after new pushes), mark a draft ready for review, or
# start it from the Actions tab or with `gh workflow run ci.yml --ref
# <branch>`. Run the checks locally before pushing (AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, ready_for_review]
  workflow_dispatch:

jobs:
  checks:
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || github.event.action == 'ready_for_review'
      || github.event.label.name == 'run-ci'
    # a new run of the same pull request or branch cancels the one running;
    # a skipped run, such as for another label, cancels nothing
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # quailb (the QUAIL-B benchmark) installs from the private
      # fsdatalab/quail-bench repository; the default Actions token
      # cannot read it, so QUAILB_TOKEN is a fine-grained token with
      # read access to that repository's contents
      - name: Authorize the quail-bench repository
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.QUAILB_TOKEN }}@github.com/".insteadOf
          "https://github.com/"
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml links Linux builds with clang and lld
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      # builds _quail_native and quail-server with the Rust that
      # rust-toolchain.toml pins; cargo test reuses the dependencies
      - run: tools/build.sh --compile
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: uv run --no-sync ruff check quail bench calibrate tests experiments tools
      - run: uv run --no-sync python tools/check_long_strings.py
      - run: uv run --no-sync python tools/check_names.py
      - run: uv run --no-sync vulture
      - run: uv run --no-sync lint-imports
      - run: uv run --no-sync pytest -q
