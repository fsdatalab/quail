name: Native wheels

# Builds the Rust module _quail_native for a commit's Rust sources and
# uploads it to the `native-wheels` release. tools/build.sh downloads
# the module from there, so a developer who edits no Rust compiles
# nothing. The asset name holds the key of the sources
# (tools/native_key.py), so a commit that changes no Rust reuses the
# module already uploaded.
#
# The workflow runs when the Rust sources change on main, and on demand
# for any branch: Actions tab, or
# `gh workflow run native-wheels.yml --ref <branch>`.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Key of the Rust sources
        id: key
        run: echo "asset=quail_native-$(python3 tools/native_key.py)-${{ matrix.platform }}.whl" >> "$GITHUB_OUTPUT"
      - name: Look for the module
        id: found
        run: |
          gh release view native-wheels >/dev/null 2>&1 \
            || gh release create native-wheels --prerelease \
                 --title "Prebuilt _quail_native modules" \
                 --notes "tools/build.sh downloads these; see AGENTS.md."
          if gh release view native-wheels --json assets --jq '.assets[].name' \
               | grep -qx "${{ steps.key.outputs.asset }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the wheel
        if: steps.found.outputs.exists != 'true'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          manylinux: "2_28"
          # .cargo/config.toml links Linux x86_64 builds with clang and lld
          before-script-linux: dnf install -y clang lld
      - name: Upload the module
        if: steps.found.outputs.exists != 'true'
        run: |
          mv dist/*.whl "${{ steps.key.outputs.asset }}"
          gh release upload native-wheels "${{ steps.key.outputs.asset }}" --clobber
