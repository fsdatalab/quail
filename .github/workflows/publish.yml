name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quail-engine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          python-version: "3.12"
          version: "0.12.13"
      - name: Authorize the quail-bench repository
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.QUAILB_TOKEN }}@github.com/".insteadOf
          "https://github.com/"
      - name: Build and check the release
        run: tools/release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release files
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
