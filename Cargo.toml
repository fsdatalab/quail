[workspace]
resolver = "2"
members = [
    "crates/quail",
    "crates/quail-cost",
    "crates/quail-inputs",
    "crates/quail-datafusion",
    "crates/quail-native",
    "crates/quail-physical",
    "crates/quail-planner",
]

# Full debug info for DataFusion's dependency tree takes many gigabytes,
# and linking it dominates a rebuild; dependencies get none.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

# Rebuilding the Python module after an edit recompiles only Quail's
# crates: incrementally, in many codegen units. Dependencies, compiled
# once, keep the default units.
[profile.release]
incremental = true
codegen-units = 64

[profile.release.package."*"]
codegen-units = 16
incremental = false
