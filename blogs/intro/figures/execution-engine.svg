<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" role="img" aria-labelledby="title desc">
  <title id="title">BIO-3 physical plan and Quail execution engine</title>
  <desc id="desc">The BIO-3 physical plan appears on the left. On the right, a CPU region contains document tokenization, the physical plan executor, the packed filter and anchored join schedulers, the other physical operators, and the KV manager. A GPU region contains one model copy, one KV pool in HBM, and the model forward pass.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #667085; stroke-width: 2; }
      .cpu-zone { fill: #f5f8fd; stroke: #8ba6c9; stroke-width: 2; }
      .gpu-zone { fill: #f5faf2; stroke: #8fad7d; stroke-width: 2; }
      .cpu { fill: #dbe7f7; stroke: #667085; stroke-width: 2; }
      .gpu { fill: #dcebd3; stroke: #667085; stroke-width: 2; }
      .input { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
      .edge { fill: none; stroke: #667085; stroke-width: 3; marker-end: url(#arrow); }
      .edge-light { fill: none; stroke: #98a2b3; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #98a2b3; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .heading { fill: #101828; font: 600 28px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .zone-heading { fill: #344054; font: 600 22px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #101828; font: 500 21px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #344054; font: 400 18px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .arrow-label { fill: #475467; font: 400 16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="frame" x="25" y="25" width="1750" height="820" rx="12"/>
  <line x1="700" y1="25" x2="700" y2="845" stroke="#d0d5dd" stroke-width="2"/>

  <g aria-label="BIO-3 physical plan">
    <text class="heading" x="355" y="75">1. BIO-3 Physical Plan</text>

    <rect class="cpu" x="225" y="115" width="260" height="64" rx="10"/>
    <text class="label" x="355" y="148">Project</text>

    <rect class="gpu" x="225" y="230" width="260" height="64" rx="10"/>
    <text class="label" x="355" y="263">AnchoredJoin</text>

    <rect class="gpu" x="55" y="370" width="280" height="64" rx="10"/>
    <text class="label" x="195" y="403">PackedFilter</text>

    <rect class="input" x="395" y="370" width="260" height="64" rx="10"/>
    <text class="small" x="525" y="393">DocumentInput</text>
    <text class="small" x="525" y="417">reaction terms</text>

    <rect class="input" x="55" y="510" width="280" height="64" rx="10"/>
    <text class="small" x="195" y="533">DocumentInput</text>
    <text class="small" x="195" y="557">medical reports</text>

    <path class="edge" d="M 355 230 L 355 185"/>
    <path class="edge" d="M 195 370 C 195 330, 280 330, 320 299"/>
    <path class="edge" d="M 525 370 C 525 330, 430 330, 390 299"/>
    <path class="edge" d="M 195 510 L 195 440"/>
  </g>

  <g aria-label="Execution engine">
    <text class="heading" x="1235" y="75">Execution Engine</text>

    <rect class="cpu-zone" x="735" y="105" width="590" height="705" rx="12"/>
    <text class="zone-heading" x="1030" y="142">CPU</text>

    <rect class="gpu-zone" x="1360" y="105" width="380" height="705" rx="12"/>
    <text class="zone-heading" x="1550" y="142">GPU</text>

    <rect class="input" x="775" y="165" width="510" height="60" rx="10"/>
    <text class="label" x="1030" y="196">2. Tokenize Documents</text>

    <rect class="cpu" x="775" y="265" width="510" height="64" rx="10"/>
    <text class="label" x="1030" y="298">Physical Plan Executor</text>

    <rect class="cpu" x="775" y="375" width="510" height="220" rx="10"/>
    <text class="label" x="1030" y="411">4. PackedFilter Scheduler</text>
    <line x1="800" y1="438" x2="1260" y2="438" stroke="#a5b4c8" stroke-width="2"/>
    <text class="label" x="1030" y="472">5. AnchoredJoin Scheduler</text>
    <line x1="800" y1="500" x2="1260" y2="500" stroke="#a5b4c8" stroke-width="2"/>
    <text class="label" x="1030" y="530">Other Physical Operators</text>
    <text class="small" x="1030" y="564">Project, Limit, Exchange, Recombine</text>

    <rect class="cpu" x="775" y="680" width="510" height="64" rx="10"/>
    <text class="label" x="1030" y="713">3. KV Manager</text>

    <rect class="gpu" x="1400" y="165" width="300" height="60" rx="10"/>
    <text class="label" x="1550" y="196">2. Model Copy</text>

    <rect class="gpu" x="1400" y="375" width="300" height="126" rx="10"/>
    <text class="label" x="1550" y="438">6. Model Forward Pass</text>

    <rect class="gpu" x="1400" y="680" width="300" height="64" rx="10"/>
    <text class="label" x="1550" y="713">KV Pages in HBM</text>

    <path class="edge-light" d="M 1030 231 L 1030 259"/>
    <path class="edge-light" d="M 1030 335 L 1030 369"/>
    <path class="edge-both" d="M 1291 438 L 1394 438"/>
    <path class="edge-light" d="M 1291 712 L 1394 712"/>
    <path class="edge-light" d="M 1550 231 L 1550 369"/>
    <path class="edge-light" d="M 1550 674 L 1550 507"/>
  </g>
</svg>
