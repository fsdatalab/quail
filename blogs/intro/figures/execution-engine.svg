<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" role="img" aria-labelledby="title desc">
  <title id="title">BIO-3 physical plan and Quail execution engine</title>
  <desc id="desc">The BIO-3 physical plan appears on the left. On the right, a CPU region contains document tokenization, the physical plan executor, the packed filter and anchored join schedulers, the KV manager, and answer processing. A GPU region contains one model copy, one KV pool in HBM, and the model forward pass.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #667085; stroke-width: 2; }
      .cpu-zone { fill: #f5f8fd; stroke: #8ba6c9; stroke-width: 2; }
      .gpu-zone { fill: #f5faf2; stroke: #8fad7d; stroke-width: 2; }
      .cpu { fill: #dbe7f7; stroke: #667085; stroke-width: 2; }
      .gpu { fill: #dcebd3; stroke: #667085; stroke-width: 2; }
      .input { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
      .edge { fill: none; stroke: #667085; stroke-width: 3; marker-end: url(#arrow); }
      .edge-light { fill: none; stroke: #98a2b3; stroke-width: 2.5; marker-end: url(#arrow); }
      .heading { fill: #101828; font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .zone-heading { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #101828; font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #344054; font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .arrow-label { fill: #475467; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="frame" x="25" y="25" width="1750" height="820" rx="4"/>
  <line x1="700" y1="25" x2="700" y2="845" stroke="#d0d5dd" stroke-width="2"/>

  <g aria-label="BIO-3 physical plan">
    <text class="heading" x="355" y="75">1. BIO-3 Physical Plan</text>

    <rect class="cpu" x="225" y="115" width="260" height="64" rx="4"/>
    <text class="label" x="355" y="148">Project</text>

    <rect class="gpu" x="225" y="230" width="260" height="64" rx="4"/>
    <text class="label" x="355" y="263">Anchored Join</text>

    <rect class="gpu" x="55" y="370" width="280" height="64" rx="4"/>
    <text class="label" x="195" y="403">Packed Filter</text>

    <rect class="input" x="395" y="370" width="260" height="64" rx="4"/>
    <text class="small" x="525" y="393">Document Input</text>
    <text class="small" x="525" y="417">reaction terms</text>

    <rect class="input" x="55" y="510" width="280" height="64" rx="4"/>
    <text class="small" x="195" y="533">Document Input</text>
    <text class="small" x="195" y="557">medical reports</text>

    <path class="edge" d="M 355 230 L 355 185"/>
    <path class="edge" d="M 195 370 C 195 330, 280 330, 320 299"/>
    <path class="edge" d="M 525 370 C 525 330, 430 330, 390 299"/>
    <path class="edge" d="M 195 510 L 195 440"/>
  </g>

  <path class="edge" d="M 665 297 L 769 297"/>

  <g aria-label="Execution engine">
    <text class="heading" x="1235" y="75">Execution Engine</text>

    <rect class="cpu-zone" x="735" y="105" width="590" height="705" rx="8"/>
    <text class="zone-heading" x="1030" y="142">CPU</text>

    <rect class="gpu-zone" x="1360" y="105" width="380" height="705" rx="8"/>
    <text class="zone-heading" x="1550" y="142">GPU</text>

    <rect class="input" x="775" y="165" width="510" height="60" rx="4"/>
    <text class="label" x="1030" y="196">2. Tokenize Documents</text>

    <rect class="cpu" x="775" y="265" width="510" height="64" rx="4"/>
    <text class="label" x="1030" y="298">Physical Plan Executor</text>

    <rect class="cpu" x="775" y="375" width="510" height="126" rx="4"/>
    <text class="label" x="1030" y="411">4. Packed Filter Scheduler</text>
    <line x1="800" y1="438" x2="1260" y2="438" stroke="#a5b4c8" stroke-width="2"/>
    <text class="label" x="1030" y="472">5. Anchored Join Scheduler</text>

    <rect class="cpu" x="775" y="570" width="235" height="64" rx="4"/>
    <text class="small" x="892" y="603">Read Previous Answers</text>

    <rect class="cpu" x="1050" y="570" width="235" height="64" rx="4"/>
    <text class="label" x="1167" y="603">3. KV Manager</text>

    <rect class="gpu" x="1400" y="165" width="300" height="60" rx="4"/>
    <text class="label" x="1550" y="196">2. Model Copy</text>

    <rect class="gpu" x="1400" y="375" width="300" height="64" rx="4"/>
    <text class="label" x="1550" y="408">6. Model Forward Pass</text>

    <rect class="gpu" x="1400" y="570" width="300" height="64" rx="4"/>
    <text class="label" x="1550" y="603">KV Pages in HBM</text>

    <path class="edge-light" d="M 1030 231 L 1030 259"/>
    <path class="edge-light" d="M 1030 335 L 1030 369"/>
    <path class="edge-light" d="M 892 564 L 892 507"/>
    <path class="edge-light" d="M 1167 507 L 1167 564"/>
    <path class="edge-light" d="M 1291 602 L 1394 602"/>
    <path class="edge-light" d="M 1285 438 L 1394 408"/>
    <text class="arrow-label" x="1340" y="390">token chunk</text>
    <path class="edge-light" d="M 1550 231 L 1550 369"/>
    <path class="edge-light" d="M 1550 564 L 1550 445"/>
    <path class="edge-light" d="M 1706 408 C 1730 408, 1730 725, 892 725 L 892 640"/>
    <text class="arrow-label" x="1320" y="750">TRUE / FALSE answers</text>
  </g>
</svg>
