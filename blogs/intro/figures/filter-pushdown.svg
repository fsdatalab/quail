<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Filter pushdown in the example query</title>
  <desc id="desc">The logical plan from the parser places the report filter above the join. Quail moves the filter below the join, directly above the reports scan, so rejected reports do not enter the join.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .box { fill: #dcebd3; stroke: #667085; stroke-width: 2; }
      .relational { fill: #dbe7f7; stroke: #667085; stroke-width: 2; }
      .input { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
      .edge { fill: none; stroke: #667085; stroke-width: 3; marker-end: url(#arrow); }
      .transform { fill: none; stroke: #667085; stroke-width: 5; marker-end: url(#arrow); }
      .heading { fill: #101828; font: 600 28px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #101828; font: 500 25px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #344054; font: 400 21px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <g aria-label="Logical plan from parser">
    <text class="heading" x="340" y="42">Logical plan from parser</text>

    <rect class="relational" x="210" y="72" width="260" height="68" rx="10"/>
    <text class="label" x="340" y="115">Projection</text>

    <path class="edge" d="M 340 220 L 340 146"/>
    <rect class="box" x="210" y="220" width="260" height="68" rx="10"/>
    <text class="label" x="340" y="263">AI Filter</text>

    <path class="edge" d="M 340 368 L 340 294"/>
    <rect class="box" x="210" y="368" width="260" height="68" rx="10"/>
    <text class="label" x="340" y="411">AI Join</text>

    <path class="edge" d="M 170 522 C 170 475, 250 466, 295 442"/>
    <path class="edge" d="M 510 522 C 510 475, 430 466, 385 442"/>
    <rect class="input" x="55" y="522" width="230" height="68" rx="10"/>
    <text class="small" x="170" y="565">reports</text>
    <rect class="input" x="395" y="522" width="230" height="68" rx="10"/>
    <text class="small" x="510" y="565">reaction_terms</text>
  </g>

  <path class="transform" d="M 642 315 L 758 315"/>
  <text class="small" x="700" y="292">push filter down</text>

  <g aria-label="Plan after filter pushdown">
    <text class="heading" x="1060" y="42">After filter pushdown</text>

    <rect class="relational" x="930" y="72" width="260" height="68" rx="10"/>
    <text class="label" x="1060" y="115">Projection</text>

    <path class="edge" d="M 1060 220 L 1060 146"/>
    <rect class="box" x="930" y="220" width="260" height="68" rx="10"/>
    <text class="label" x="1060" y="263">AI Join</text>

    <path class="edge" d="M 890 368 C 890 322, 970 312, 1015 294"/>
    <path class="edge" d="M 1230 368 C 1230 322, 1150 312, 1105 294"/>
    <rect class="box" x="760" y="368" width="260" height="68" rx="10"/>
    <text class="label" x="890" y="411">AI Filter</text>
    <rect class="input" x="1115" y="368" width="230" height="68" rx="10"/>
    <text class="small" x="1230" y="411">reaction_terms</text>

    <path class="edge" d="M 890 522 L 890 442"/>
    <rect class="input" x="775" y="522" width="230" height="68" rx="10"/>
    <text class="small" x="890" y="565">reports</text>
  </g>
</svg>
