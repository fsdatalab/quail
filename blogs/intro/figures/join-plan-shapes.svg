<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Left deep and bushy join plans</title>
  <desc id="desc">A left deep plan adds one base table to the current intermediate result at each join. A bushy plan can join two intermediate results.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <style>
      .join { fill: #dcebd3; stroke: #5f6368; stroke-width: 2; }
      .table { fill: #f6f8f4; stroke: #5f6368; stroke-width: 2; }
      .edge { fill: none; stroke: #5f6368; stroke-width: 3; marker-end: url(#arrow); }
      .heading { fill: #111111; font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #111111; font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <g aria-label="Left deep join plan">
    <text class="heading" x="300" y="38">Left deep plan</text>

    <path class="edge" d="M 240 190 L 275 140"/>
    <path class="edge" d="M 450 190 L 350 140"/>
    <rect class="join" x="240" y="80" width="120" height="60" rx="4"/>
    <text class="label" x="300" y="111">Join</text>

    <path class="edge" d="M 180 300 L 215 250"/>
    <path class="edge" d="M 360 300 L 290 250"/>
    <rect class="join" x="180" y="190" width="120" height="60" rx="4"/>
    <text class="label" x="240" y="221">Join</text>

    <path class="edge" d="M 110 410 L 155 360"/>
    <path class="edge" d="M 240 410 L 210 360"/>
    <rect class="join" x="120" y="300" width="120" height="60" rx="4"/>
    <text class="label" x="180" y="331">Join</text>

    <rect class="table" x="55" y="410" width="110" height="60" rx="4"/>
    <text class="label" x="110" y="441">A</text>
    <rect class="table" x="185" y="410" width="110" height="60" rx="4"/>
    <text class="label" x="240" y="441">B</text>
    <rect class="table" x="305" y="300" width="110" height="60" rx="4"/>
    <text class="label" x="360" y="331">C</text>
    <rect class="table" x="395" y="190" width="110" height="60" rx="4"/>
    <text class="label" x="450" y="221">D</text>
  </g>

  <g aria-label="Bushy join plan">
    <text class="heading" x="900" y="38">Bushy plan</text>

    <path class="edge" d="M 740 220 L 855 140"/>
    <path class="edge" d="M 1020 220 L 945 140"/>
    <rect class="join" x="840" y="80" width="120" height="60" rx="4"/>
    <text class="label" x="900" y="111">Join</text>

    <path class="edge" d="M 670 365 L 710 280"/>
    <path class="edge" d="M 810 365 L 770 280"/>
    <rect class="join" x="680" y="220" width="120" height="60" rx="4"/>
    <text class="label" x="740" y="251">Join</text>

    <path class="edge" d="M 950 365 L 990 280"/>
    <path class="edge" d="M 1090 365 L 1050 280"/>
    <rect class="join" x="960" y="220" width="120" height="60" rx="4"/>
    <text class="label" x="1020" y="251">Join</text>

    <rect class="table" x="615" y="365" width="110" height="60" rx="4"/>
    <text class="label" x="670" y="396">A</text>
    <rect class="table" x="755" y="365" width="110" height="60" rx="4"/>
    <text class="label" x="810" y="396">B</text>
    <rect class="table" x="895" y="365" width="110" height="60" rx="4"/>
    <text class="label" x="950" y="396">C</text>
    <rect class="table" x="1035" y="365" width="110" height="60" rx="4"/>
    <text class="label" x="1090" y="396">D</text>
  </g>
</svg>
