<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">The same join batch in vLLM and Quail</title>
  <desc id="desc">Both sides evaluate the same four document pairs. vLLM stores one copy of the KV for document A and document C, but its block table has four rows, one for each sequence in the batch. Quail groups the sequences by their first document, so its block table has one row for document A and one row for document C. Quail computes attention over the rest of each prompt and into the shared anchor KV separately, then merges the outputs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #5f6368; stroke-width: 2; }
      .op { fill: #f0f0f0; stroke: #5f6368; stroke-width: 2; }
      .doc-a { fill: #c8daf0; stroke: #5f6368; stroke-width: 2; }
      .doc-c { fill: #cfe5c4; stroke: #5f6368; stroke-width: 2; }
      .doc-1 { fill: #f7dfad; stroke: #5f6368; stroke-width: 2; }
      .doc-2 { fill: #e8cfe1; stroke: #5f6368; stroke-width: 2; }
      .arrow { fill: none; stroke: #5f6368; stroke-width: 3; marker-end: url(#arrow); }
      .line { fill: none; stroke: #5f6368; stroke-width: 2.5; }
      .dash { fill: none; stroke: #8a8d91; stroke-width: 2; stroke-dasharray: 7 7; }
      .title { fill: #111111; font: 600 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .heading { fill: #111111; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #111111; font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #111111; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="frame" x="25" y="25" width="1750" height="880"/>
  <line class="line" x1="900" y1="25" x2="900" y2="905"/>
  <line class="dash" x1="25" y1="390" x2="1775" y2="390"/>
  <line class="dash" x1="25" y1="650" x2="1775" y2="650"/>

  <text class="title" x="465" y="72">vLLM Batch</text>
  <text class="title" x="1335" y="72">Quail Anchored Batch</text>

  <g aria-label="The vLLM batch contains four sequences">
    <rect class="doc-a" x="145" y="105" width="250" height="50" rx="3"/>
    <text class="label" x="270" y="130">Document A</text>
    <rect class="doc-1" x="395" y="105" width="250" height="50" rx="3"/>
    <text class="label" x="520" y="130">Document 1</text>

    <rect class="doc-a" x="145" y="170" width="250" height="50" rx="3"/>
    <text class="label" x="270" y="195">Document A</text>
    <rect class="doc-2" x="395" y="170" width="250" height="50" rx="3"/>
    <text class="label" x="520" y="195">Document 2</text>

    <rect class="doc-c" x="145" y="235" width="250" height="50" rx="3"/>
    <text class="label" x="270" y="260">Document C</text>
    <rect class="doc-1" x="395" y="235" width="250" height="50" rx="3"/>
    <text class="label" x="520" y="260">Document 1</text>

    <rect class="doc-c" x="145" y="300" width="250" height="50" rx="3"/>
    <text class="label" x="270" y="325">Document C</text>
    <rect class="doc-2" x="395" y="300" width="250" height="50" rx="3"/>
    <text class="label" x="520" y="325">Document 2</text>
  </g>

  <g aria-label="The Quail batch contains the same pairs grouped by first document">
    <rect class="doc-a" x="995" y="125" width="210" height="70" rx="3"/>
    <text class="label" x="1100" y="160">Document A</text>
    <rect class="doc-1" x="1240" y="105" width="200" height="50" rx="3"/>
    <text class="label" x="1340" y="130">Document 1</text>
    <rect class="doc-2" x="1465" y="105" width="200" height="50" rx="3"/>
    <text class="label" x="1565" y="130">Document 2</text>
    <path class="line" d="M 1205 160 L 1225 160 L 1225 130 L 1235 130"/>
    <path class="line" d="M 1225 160 L 1450 160 L 1450 130 L 1460 130"/>

    <rect class="doc-c" x="995" y="280" width="210" height="70" rx="3"/>
    <text class="label" x="1100" y="315">Document C</text>
    <rect class="doc-1" x="1240" y="260" width="200" height="50" rx="3"/>
    <text class="label" x="1340" y="285">Document 1</text>
    <rect class="doc-2" x="1465" y="260" width="200" height="50" rx="3"/>
    <text class="label" x="1565" y="285">Document 2</text>
    <path class="line" d="M 1205 315 L 1225 315 L 1225 285 L 1235 285"/>
    <path class="line" d="M 1225 315 L 1450 315 L 1450 285 L 1460 285"/>
  </g>

  <g aria-label="vLLM attention metadata">
    <text class="heading" x="465" y="430">Block table</text>
    <rect class="doc-a" x="125" y="455" width="145" height="45" rx="3"/>
    <text class="label" x="197.5" y="478">A</text>
    <rect class="doc-a" x="285" y="455" width="145" height="45" rx="3"/>
    <text class="label" x="357.5" y="478">A</text>
    <rect class="doc-c" x="445" y="455" width="145" height="45" rx="3"/>
    <text class="label" x="517.5" y="478">C</text>
    <rect class="doc-c" x="605" y="455" width="145" height="45" rx="3"/>
    <text class="label" x="677.5" y="478">C</text>

    <text class="heading" x="190" y="600">KV cache</text>
    <rect class="doc-a" x="275" y="570" width="170" height="50" rx="3"/>
    <text class="label" x="360" y="595">A KV</text>
    <rect class="doc-c" x="485" y="570" width="170" height="50" rx="3"/>
    <text class="label" x="570" y="595">C KV</text>

    <path class="line" d="M 198 505 C 198 535, 325 535, 340 565"/>
    <path class="line" d="M 358 505 L 358 565"/>
    <path class="line" d="M 518 505 L 555 565"/>
    <path class="line" d="M 678 505 C 678 535, 595 535, 580 565"/>
  </g>

  <g aria-label="Quail attention metadata">
    <text class="heading" x="1335" y="430">Block table</text>
    <rect class="doc-a" x="1160" y="455" width="160" height="45" rx="3"/>
    <text class="label" x="1240" y="478">A</text>
    <rect class="doc-c" x="1350" y="455" width="160" height="45" rx="3"/>
    <text class="label" x="1430" y="478">C</text>

    <text class="heading" x="1040" y="600">KV cache</text>
    <rect class="doc-a" x="1160" y="570" width="160" height="50" rx="3"/>
    <text class="label" x="1240" y="595">A KV</text>
    <rect class="doc-c" x="1350" y="570" width="160" height="50" rx="3"/>
    <text class="label" x="1430" y="595">C KV</text>

    <path class="line" d="M 1240 505 L 1240 565"/>
    <path class="line" d="M 1430 505 L 1430 565"/>
  </g>

  <g aria-label="vLLM attention call">
    <rect class="op" x="225" y="720" width="480" height="85" rx="4"/>
    <text class="label" x="465" y="763">FA3 over four sequences</text>
    <path class="arrow" d="M 465 625 L 465 715"/>
  </g>

  <g aria-label="Quail split attention calls">
    <rect class="op" x="945" y="690" width="350" height="75" rx="4"/>
    <text class="small" x="1120" y="728">FA3 over the rest of each prompt</text>
    <rect class="op" x="1375" y="690" width="350" height="75" rx="4"/>
    <text class="small" x="1550" y="728">FA3 into the anchor KV</text>
    <rect class="op" x="1170" y="825" width="330" height="60" rx="4"/>
    <text class="label" x="1335" y="855">Logsumexp merge</text>

    <path class="arrow" d="M 1240 625 C 1240 660, 1460 660, 1500 685"/>
    <path class="arrow" d="M 1430 625 C 1430 655, 1530 660, 1560 685"/>
    <path class="arrow" d="M 1120 770 C 1120 805, 1210 815, 1250 820"/>
    <path class="arrow" d="M 1550 770 C 1550 805, 1460 815, 1420 820"/>
  </g>
</svg>
