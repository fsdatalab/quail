<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Quail architecture</title>
  <desc id="desc">The query frontend creates a logical plan. The query planner estimates dataset statistics, sets the forward pass batch size and KV capacity, applies three query rewrites, and produces a physical plan. The execution engine runs the plan across the CPU and GPU.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <marker id="arrow-both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #667085; stroke-width: 2; }
      .input { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
      .plan { fill: #dbe7f7; stroke: #667085; stroke-width: 2; }
      .planner { fill: #dbe7f7; stroke: #667085; stroke-width: 2; }
      .rewrite-group { fill: #f5f8fd; stroke: #8ba6c9; stroke-width: 2; }
      .rewrite { fill: #ffffff; stroke: #8ba6c9; stroke-width: 2; }
      .cpu { fill: #f5f8fd; stroke: #8ba6c9; stroke-width: 2; }
      .gpu { fill: #f5faf2; stroke: #8fad7d; stroke-width: 2; }
      .edge { fill: none; stroke: #667085; stroke-width: 3; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #667085; stroke-width: 3; marker-start: url(#arrow-both); marker-end: url(#arrow-both); }
      .section { fill: #101828; font: 600 31px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #101828; font: 500 24px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #344054; font: 500 21px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .group-title { fill: #101828; font: 600 24px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .zone { fill: #101828; font: 600 27px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .divider { stroke: #d0d5dd; stroke-width: 2; }
    </style>
  </defs>

  <rect class="frame" x="25" y="25" width="1750" height="590" rx="12"/>
  <line class="divider" x1="520" y1="25" x2="520" y2="615"/>
  <line class="divider" x1="1480" y1="25" x2="1480" y2="615"/>

  <g aria-label="Query frontend">
    <rect class="input" x="50" y="150" width="220" height="70" rx="10"/>
    <text class="small" x="160" y="186">Arrow table or dataset</text>

    <rect class="input" x="50" y="285" width="220" height="70" rx="10"/>
    <text class="small" x="160" y="321">AI-SQL or Python API</text>

    <rect class="plan" x="320" y="245" width="170" height="110" rx="10"/>
    <text class="label" x="405" y="286">Logical</text>
    <text class="label" x="405" y="320">plan</text>

    <path class="edge" d="M 270 185 L 320 270"/>
    <path class="edge" d="M 270 320 L 320 320"/>

    <rect class="input" x="50" y="465" width="220" height="70" rx="10"/>
    <text class="label" x="160" y="501">Model and GPU</text>
  </g>

  <g aria-label="Query planner">
    <rect class="planner" x="550" y="245" width="170" height="110" rx="10"/>
    <text class="small" x="635" y="284">Estimate dataset</text>
    <text class="small" x="635" y="316">statistics</text>

    <rect class="planner" x="750" y="245" width="210" height="110" rx="10"/>
    <text class="small" x="855" y="274">Set forward pass</text>
    <text class="small" x="855" y="302">batch size and</text>
    <text class="small" x="855" y="330">KV capacity</text>

    <rect class="rewrite-group" x="990" y="115" width="260" height="370" rx="12"/>
    <text class="group-title" x="1120" y="157">Query rewrites</text>

    <rect class="rewrite" x="1010" y="185" width="220" height="72" rx="9"/>
    <text class="small" x="1120" y="210">Projection and filter</text>
    <text class="small" x="1120" y="238">pushdown</text>

    <rect class="rewrite" x="1010" y="278" width="220" height="72" rx="9"/>
    <text class="small" x="1120" y="315">Filter ordering</text>

    <rect class="rewrite" x="1010" y="371" width="220" height="88" rx="9"/>
    <text class="small" x="1120" y="398">Join ordering and</text>
    <text class="small" x="1120" y="426">anchor selection</text>

    <rect class="plan" x="1280" y="245" width="170" height="110" rx="10"/>
    <text class="label" x="1365" y="286">Physical</text>
    <text class="label" x="1365" y="320">plan</text>

    <path class="edge" d="M 490 300 L 550 300"/>
    <path class="edge" d="M 720 300 L 750 300"/>
    <path class="edge" d="M 960 300 L 990 300"/>
    <path class="edge" d="M 1250 300 L 1280 300"/>
    <path class="edge" d="M 270 500 C 500 500, 620 405, 770 355"/>
  </g>

  <g aria-label="Execution engine">
    <rect class="cpu" x="1520" y="245" width="100" height="110" rx="10"/>
    <text class="zone" x="1570" y="302">CPU</text>

    <rect class="gpu" x="1670" y="245" width="100" height="110" rx="10"/>
    <text class="zone" x="1720" y="302">GPU</text>

    <path class="edge" d="M 1450 300 L 1520 300"/>
    <path class="edge-both" d="M 1620 300 L 1670 300"/>
  </g>

  <text class="section" x="260" y="675">Query frontend</text>
  <text class="section" x="1000" y="675">Query planner</text>
  <text class="section" x="1625" y="675">Execution engine</text>
</svg>
