<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 690" role="img" aria-labelledby="title desc">
  <title id="title">Quail architecture</title>
  <desc id="desc">An Arrow table or dataset, AI-SQL or the Python API, and the selected model and GPU are specified through the query frontend. The query frontend creates a logical plan. The query planner performs filter ordering, join ordering, and forward pass sizing, then produces a physical operator plan. The execution engine runs the physical operators, manages the KV cache, and executes the model.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <style>
      .box { fill: #dcebd3; stroke: #5f6368; stroke-width: 2; }
      .frame { fill: #ffffff; stroke: #5f6368; stroke-width: 2; }
      .arrow { fill: none; stroke: #5f6368; stroke-width: 6; marker-end: url(#arrow); }
      .heading { fill: #111111; font: 600 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #111111; font: 400 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .compact-label { fill: #111111; font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .plan { fill: #111111; font: 400 27px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
      .section { fill: #111111; font: 600 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="frame" x="25" y="25" width="1550" height="565"/>

  <g aria-label="Query frontend">
    <text class="heading" x="60" y="75">Inputs and configuration</text>

    <rect class="box" x="60" y="105" width="245" height="66"/>
    <text class="compact-label" x="182.5" y="146">Arrow Table or Dataset</text>

    <rect class="box" x="60" y="195" width="245" height="66"/>
    <text class="label" x="182.5" y="237">AI-SQL</text>

    <rect class="box" x="60" y="285" width="245" height="66"/>
    <text class="label" x="182.5" y="327">Python API</text>

    <rect class="box" x="60" y="375" width="245" height="66"/>
    <text class="label" x="182.5" y="417">Model and GPU</text>

    <path class="arrow" d="M 320 138 L 382 238"/>
    <path class="arrow" d="M 320 273 L 382 294"/>
    <path class="arrow" d="M 320 408 C 500 408, 585 408, 688 337"/>

    <rect class="box" x="395" y="220" width="235" height="110"/>
    <text class="plan" x="512.5" y="286">Logical Plan</text>
  </g>

  <g aria-label="Query planner">
    <path class="arrow" d="M 646 275 L 688 275"/>

    <rect class="box" x="700" y="105" width="270" height="66"/>
    <text class="label" x="835" y="147">Filter Ordering</text>

    <rect class="box" x="700" y="195" width="270" height="66"/>
    <text class="label" x="835" y="237">Join Ordering</text>

    <rect class="box" x="700" y="285" width="270" height="66"/>
    <text class="label" x="835" y="327">Forward Pass Sizing</text>

    <path class="arrow" d="M 977 275 L 1019 275"/>

    <rect class="box" x="1032" y="220" width="255" height="110"/>
    <text class="compact-label" x="1159.5" y="268">Physical Operator</text>
    <text class="compact-label" x="1159.5" y="299">Plan</text>
  </g>

  <g aria-label="Execution engine">
    <path class="arrow" d="M 1293 275 L 1335 275"/>

    <rect class="box" x="1360" y="65" width="175" height="66"/>
    <text class="label" x="1447.5" y="107">Packed Filter</text>

    <rect class="box" x="1360" y="155" width="175" height="66"/>
    <text class="label" x="1447.5" y="197">Anchored Join</text>

    <rect class="box" x="1360" y="245" width="175" height="66"/>
    <text class="label" x="1447.5" y="287">KV Manager</text>

    <rect class="box" x="1360" y="335" width="175" height="66"/>
    <text class="label" x="1447.5" y="377">Model</text>
  </g>

  <line x1="25" y1="590" x2="1575" y2="590" stroke="#5f6368" stroke-width="2"/>
  <text class="section" x="345" y="645">Query Frontend</text>
  <text class="section" x="965" y="645">Query Planner</text>
  <text class="section" x="1447.5" y="645">Execution Engine</text>
</svg>
