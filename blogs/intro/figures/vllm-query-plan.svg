<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Physical query plan used by the vLLM baseline</title>
  <desc id="desc">The plan scans medical reports, filters them for reports about female patients, materializes the filtered reports, and joins them with a scan of reaction terms. The filtered report is the anchor in each join prompt.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #475467; stroke-width: 2; }
      .ai-node { fill: #eef4ff; stroke: #2e5aac; stroke-width: 2.5; }
      .edge { fill: none; stroke: #667085; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { fill: #101828; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .detail { fill: #344054; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #475467; font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .stage { fill: #2e5aac; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <text class="stage" x="312" y="24">Runs second</text>
  <rect class="ai-node" x="310" y="38" width="300" height="108" rx="10"/>
  <text class="label" x="460" y="76">AI_JOIN</text>
  <text class="detail" x="460" y="103">reaction experienced?</text>
  <text class="small" x="460" y="129">anchor: report, partner: reaction term</text>

  <path class="edge" d="M 230 252 C 230 202, 360 196, 400 150"/>
  <path class="edge" d="M 735 252 C 735 202, 575 196, 520 150"/>
  <rect x="166" y="169" width="238" height="31" rx="5" fill="#ffffff"/>
  <text class="small" x="285" y="190">materialized filtered reports</text>

  <text class="stage" x="82" y="238">Runs first</text>
  <rect class="ai-node" x="80" y="252" width="300" height="92" rx="10"/>
  <text class="label" x="230" y="290">AI_FILTER</text>
  <text class="detail" x="230" y="320">female patient?</text>

  <rect class="node" x="610" y="252" width="250" height="92" rx="10"/>
  <text class="label" x="735" y="292">Scan</text>
  <text class="detail" x="735" y="320">reaction_terms</text>

  <path class="edge" d="M 230 406 L 230 350"/>
  <rect class="node" x="105" y="406" width="250" height="72" rx="10"/>
  <text class="label" x="230" y="438">Scan</text>
  <text class="detail" x="230" y="463">reports</text>
</svg>
