[package]
name = "quail-datafusion"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Quail's AI functions and model region planning as a DataFusion extension"

[dependencies]
async-trait = "0.1"
datafusion = { version = "55.2.0", default-features = false, features = ["sql", "nested_expressions"] }
datafusion-common-runtime = "55.2.0"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
