[package]
name = "quail-inputs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Quail's tokenized document columns: token stores, length estimates, and prefix statistics"
publish = false

[dependencies]
serde_json = "1"
arrow = { version = "59.3.2", default-features = false, features = ["ipc"] }
# the 1.0 release candidate tokenizes about 30 times faster than 0.22
# with the same ids; pinned until 1.0 is released
tokenizers = { version = "=1.0.0-rc.3", default-features = false, features = ["parallelism", "serialize", "normalizers", "bpe", "unicode-scripts"] }

[dev-dependencies]
tempfile = "3"
