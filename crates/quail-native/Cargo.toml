[package]
name = "quail-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Python bindings for Quail's Rust crates"
publish = false

[lib]
name = "_quail_native"
crate-type = ["cdylib"]

[dependencies]
quail-cost = { path = "../quail-cost" }
async-trait = "0.1"
datafusion = { version = "55.2.0", default-features = false, features = ["sql", "nested_expressions"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
quail-datafusion = { path = "../quail-datafusion" }
quail-physical = { path = "../quail-physical" }
quail-planner = { path = "../quail-planner" }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
