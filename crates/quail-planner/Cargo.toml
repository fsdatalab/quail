[package]
name = "quail-planner"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Quail's planner: logical plans, rules, and search"

[dependencies]
quail-cost = { path = "../quail-cost" }
quail-physical = { path = "../quail-physical" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
arrow-ipc = "59.3"
arrow-schema = "59.3"
base64 = "0.23"
