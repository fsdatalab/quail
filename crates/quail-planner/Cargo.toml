[package]
name = "quail-planner"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Quail's planner of one model region: its operators, cost model, search, and physical plan"
publish = false

[dependencies]
arrow = { version = "59.3.2", default-features = false, features = [] }
arrow-ipc = "59.3"
arrow-schema = "59.3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# the 1.0 release candidate tokenizes about 30 times faster than 0.22
# with the same ids; pinned until 1.0 is released
tokenizers = { version = "=1.0.0-rc.3", default-features = false, features = ["parallelism", "serialize", "normalizers", "bpe", "unicode-scripts"] }
toml = "0.9"
