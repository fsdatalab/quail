[package]
name = "quail-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Quail's Session and Executor, which run model regions on Quail's Python executor, and the _quail_native Python module"
publish = false

[lib]
name = "quail_python"
# the cdylib is the _quail_native Python module; the rlib is the Rust API
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
datafusion = { version = "55.2.0", default-features = false, features = ["sql", "nested_expressions"] }
# the Arrow C stream interface, to share buffers with pyarrow
arrow = { version = "59.3.2", default-features = false, features = ["ffi", "ipc"] }
# a Rust program links libpython and starts the interpreter; maturin sets
# PYO3_BUILD_EXTENSION_MODULE, so the Python module does not link it
pyo3 = { version = "0.30", features = ["abi3-py312"] }
quail = { package = "quail-engine", path = "../quail" }
quail-datafusion = { path = "../quail-datafusion" }
quail-planner = { path = "../quail-planner" }
# the module holds the server, so the wheel holds DataFusion once
quail-server = { path = "../quail-server" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
quail-dylib = { path = "../quail-dylib" }

[build-dependencies]
pyo3-build-config = "0.30"
