[package]
name = "quail-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Quail Server: Quail's session over Arrow Flight"
publish = false

[dependencies]
arrow = { version = "59.3.2", default-features = false, features = ["ffi", "ipc"] }
arrow-flight = "59.3.2"
datafusion = { version = "55.2.0", default-features = false, features = ["sql", "nested_expressions"] }
futures = "0.3"
quail = { path = "../quail" }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tonic = "0.14"
