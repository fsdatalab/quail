[package]
name = "quail-engine"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Quail: AI functions in SQL on DataFusion, with the model's work on GPU workers"
repository = "https://github.com/fsdatalab/quail"
readme = "../../README.md"

# crates.io has another crate named quail; the library keeps the name
[lib]
name = "quail"

[dependencies]
async-trait = "0.1"
futures = "0.3"
# maps a table another process wrote, to read it over the same pages
memmap2 = "0.9"
datafusion = { version = "55.2.0", default-features = false, features = ["sql", "nested_expressions"] }
# the same features as quail-python, so both build Arrow once
arrow = { version = "59.3.2", default-features = false, features = ["ffi", "ipc"] }
quail-datafusion.workspace = true
quail-planner.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
quail-dylib = { path = "../quail-dylib" }
