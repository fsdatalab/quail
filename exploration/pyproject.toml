[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quail"
version = "0.1.0"
description = "QUery-Aware Inference Layer: plan-governed KV state for AI filter queries."
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# dev covers the CPU test suite; pandas + pyarrow for the parquet workload.
dev = [
    "pytest",
    "pandas",
    "pyarrow",
]
# The measured system runs against this exact engine build; the scheduler
# subclass reaches into private vLLM internals pinned at this version.
engine = [
    "vllm==0.26.0",
]

[tool.setuptools.packages.find]
include = ["quail", "quail.*"]
