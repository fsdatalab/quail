[project]
name = "quail"
version = "0.1.0"
description = "Quail: a declarative query engine for AI_FILTER and AI_JOIN"
readme = "README.md"
# <3.13: bpe-qwen ships wheels up to 3.12, and the Modal image runs 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot>=27.0",
    "transformers>=4.48",
    "huggingface-hub>=0.26",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "bpe-qwen>=0.1.5",
    "datasets>=5.0.1",
    # same version as the Modal image; vLLM has Linux wheels only
    "vllm==0.26.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    # Modal demos and experiments need proxy support behind HTTPS proxies.
    "modal[api-proxy-support]>=1.5.1",
    # uploads a finished labeling pass to the public bucket
    "boto3>=1.34",
    "matplotlib>=3.9",
    "pytest>=8.0",
    # the quail-b benchmark; quail/bench/ is its runner for Quail
    "quail-b",
    "ruff==0.12.9",
    "vulture>=2.16,<3",
]

[tool.uv.sources]
quail-b = { git = "https://github.com/fsdatalab/quail-bench.git", rev = "e568a739cf678d1cfbd300faad01c7009acc3e01" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail"]

[tool.uv]
# uv's Python builds include the C headers Triton needs at startup
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, N naming, D docstrings
# (Google style). D1xx (missing docstrings) stays off until the backlog
# of undocumented public methods is written.
select = ["E", "F", "W", "I", "N", "D"]
# N803/N806: Triton kernels take upper-case constexpr arguments and
# shape variables (H, KH, D) by convention. N812: torch.nn.functional
# is imported as F everywhere.
ignore = ["D1", "N803", "N806", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["quail", "quail_b", "experiments", "reports"]

[tool.vulture]
paths = ["quail"]
min_confidence = 70
