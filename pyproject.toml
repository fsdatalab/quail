[project]
name = "quail"
version = "0.1.0"
description = "Quail: a declarative query engine for AI_FILTER and AI_JOIN"
readme = "README.md"
# <3.13: bpe-qwen ships wheels up to 3.12, and the Modal image runs 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot>=27.0",
    "transformers>=4.48",
    "huggingface-hub>=0.26",
    "pyarrow>=17.0",
    "numpy>=2.0",
    # api-proxy-support pulls python-socks, which the Modal client
    # needs to connect from behind an HTTPS proxy (e.g. remote
    # Claude Code containers); without it, runs fail at connect
    "modal[api-proxy-support]>=1.5.1",
    "bpe-qwen>=0.1.5",
    "datasets>=5.0.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
    "ruff==0.12.9",
    "vulture>=2.16,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, N naming, D docstrings
# (Google style). D1xx (missing docstrings) stays off until the backlog
# of undocumented public methods is written.
select = ["E", "F", "W", "I", "N", "D"]
# N803/N806: Triton kernels take upper-case constexpr arguments and
# shape variables (H, KH, D) by convention. N812: torch.nn.functional
# is imported as F everywhere.
ignore = ["D1", "N803", "N806", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["quail", "experiments", "reports"]

[tool.vulture]
paths = ["quail"]
min_confidence = 70
