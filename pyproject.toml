[project]
name = "quail-bench"
version = "0.1.0"
description = "quail-bench: a benchmark of AI filter and join queries over document sets"
readme = "README.md"
# <3.13: the Modal images run 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=17.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "huggingface-hub>=0.26",
    "datasets>=5.0.1",
    "transformers>=4.48",
    # api-proxy-support pulls python-socks, which the Modal client
    # needs to connect from behind an HTTPS proxy
    "modal[api-proxy-support]>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.12.9",
    "vulture>=2.16,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, N naming, D docstrings
# (Google style). D1xx (missing docstrings) stays off.
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["quail_bench"]

[tool.vulture]
paths = ["quail_bench"]
min_confidence = 70
