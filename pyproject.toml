[project]
name = "quail-engine"
version = "0.1.0"
description = "Quail: a declarative query engine for AI.IF and AI_JOIN"
readme = "README.md"
license = "MIT"
# The Modal image and tested vLLM build use Python 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot==30.17.0",
    "transformers==5.15.0",
    "huggingface-hub==1.28.0",
    "pyarrow==25.0.1",
    "numpy==2.3.5; sys_platform != 'emscripten' and sys_platform != 'win32'",
    "numpy==2.5.2; sys_platform == 'emscripten' or sys_platform == 'win32'",
    "gigatoken==0.10.0",
    "datasets==5.0.1",
    # same version as the Modal image; vLLM has Linux wheels only
    "vllm==0.29.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Quail Server (quail-server), the optional query server; the client
# side of a remote Session needs only the standard library
server = [
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[project.scripts]
quail-server = "quail.server.__main__:main"

[project.urls]
Documentation = "https://fsdatalab.github.io/quail"
Repository = "https://github.com/fsdatalab/quail"
Issues = "https://github.com/fsdatalab/quail/issues"

[dependency-groups]
dev = [
    # Modal demos and experiments need proxy support behind HTTPS proxies.
    "modal[api-proxy-support]==1.5.4",
    # uploads a finished labeling pass to the public bucket
    "boto3==1.43.89",
    "matplotlib==3.11.1",
    "pytest==9.1.1",
    # the quail-b benchmark; bench/ is its runner for Quail
    "quail-b",
    "ruff==0.12.9",
    "vulture==2.16",
    # the Modal images sync this group: the readout probe reads the
    # corpus tables with pandas, and hf_transfer speeds up checkpoint
    # downloads
    "pandas==3.0.5",
    "hf-transfer==0.1.9",
    "import-linter==2.3",
]

[tool.uv.sources]
quail-b = { git = "https://github.com/fsdatalab/quail-bench.git", rev = "e8826ce" }

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "quail",
]
exclude = [
    "demos",
    "docs",
]

[tool.uv]
# uv's Python builds include the C headers Triton needs at startup
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# Phase 2 of the DataFusion plan moves planning to Rust, so the executor
# must not import planning code. ignore_imports lists the imports still
# to remove; delete an entry when its import goes, and add none.
[[tool.importlinter.contracts]]
name = "The executor imports no planning code"
type = "forbidden"
source_modules = ["quail.backends", "quail.execution"]
forbidden_modules = [
    "quail.planner",
    "quail.cost",
    "quail.logical",
    "quail.catalog",
]
allow_indirect_imports = true
ignore_imports = [
    "quail.backends.quail.coordinator -> quail.planner",
    "quail.backends.quail.distributed -> quail.catalog.pairs",
    "quail.backends.quail.distributed -> quail.catalog.tokens",
    "quail.backends.quail.distributed -> quail.planner",
    "quail.backends.quail.executor.answer_admission -> quail.cost.answers",
    "quail.backends.quail.executor.answer_admission -> quail.cost.work",
    "quail.backends.quail.executor.cuda_graphs -> quail.cost.budgets",
    "quail.backends.quail.executor.extract.stages -> quail.catalog.tokens",
    "quail.backends.quail.executor.gdn -> quail.cost.budgets",
    "quail.backends.quail.executor.label_stages -> quail.catalog.tokens",
    "quail.backends.quail.executor.map_decoder -> quail.cost.answers",
    "quail.backends.quail.executor.map_decoder -> quail.cost.budgets",
    "quail.backends.quail.executor.map_decoder -> quail.cost.draft_policy",
    "quail.backends.quail.executor.model_loading -> quail.planner.prompt_lowering",
    "quail.backends.quail.executor.models.diffusion_gemma -> quail.cost.budgets",
    "quail.backends.quail.executor.models.qwen3 -> quail.cost.budgets",
    "quail.backends.quail.executor.models.qwen3_5 -> quail.cost.budgets",
    "quail.backends.quail.executor.operators.classify -> quail.catalog.selection",
    "quail.backends.quail.executor.operators.classify -> quail.logical",
    "quail.backends.quail.executor.operators.filter -> quail.catalog.pairs",
    "quail.backends.quail.executor.operators.filter -> quail.catalog.selection",
    "quail.backends.quail.executor.operators.filter -> quail.catalog.tokens",
    "quail.backends.quail.executor.operators.join -> quail.catalog.document_ends",
    "quail.backends.quail.executor.operators.join -> quail.catalog.pairs",
    "quail.backends.quail.executor.operators.join -> quail.catalog.tokens",
    "quail.backends.quail.executor.operators.map -> quail.catalog.tokens",
    "quail.backends.quail.executor.operators.sae_features -> quail.catalog.tokens",
    "quail.backends.quail.executor.operators.sae_features -> quail.logical",
    "quail.backends.quail.executor.operators.score -> quail.catalog.tokens",
    "quail.backends.quail.executor.operators.set_classify -> quail.logical",
    "quail.backends.quail.executor.parts -> quail.catalog.tokens",
    "quail.backends.quail.executor.parts -> quail.logical",
    "quail.backends.quail.executor.pass_groups -> quail.catalog.document_ends",
    "quail.backends.quail.executor.pipeline -> quail.catalog.tokens",
    "quail.backends.quail.executor.readout -> quail.cost.budgets",
    "quail.backends.quail.executor.readout -> quail.planner.prompt_lowering",
    "quail.backends.quail.executor.runtime -> quail.cost.budgets",
    "quail.backends.quail.executor.runtime -> quail.cost.decode",
    "quail.backends.quail.executor.stage_executor -> quail.cost.work",
    "quail.backends.quail.executor.tokenizer -> quail.catalog.tokens",
    "quail.backends.quail.graph -> quail.catalog.pairs",
    "quail.backends.quail.reranker -> quail.logical",
    "quail.backends.quail.retention -> quail.cost.retention",
    "quail.backends.quail.worker -> quail.catalog.tokens",
    "quail.backends.quail.worker -> quail.cost.budgets",
    "quail.backends.quail.worker -> quail.planner.prompt_lowering",
    "quail.execution.deduplicate -> quail.catalog.pairs",
    "quail.execution.projection -> quail.catalog.pairs",
    "quail.execution.projection -> quail.logical",
    "quail.execution.projection -> quail.logical.expressions",
    "quail.execution.result -> quail.catalog.pairs",
    "quail.execution.runtimes.dataflow -> quail.catalog.pairs",
    "quail.execution.runtimes.dataflow -> quail.logical.expressions",
    "quail.execution.runtimes.filter -> quail.catalog.pairs",
    "quail.execution.runtimes.relational -> quail.catalog.pairs",
    "quail.execution.runtimes.relational -> quail.catalog.selection",
    "quail.execution.runtimes.relational -> quail.logical.expressions",
    "quail.execution.runtimes.relational -> quail.logical.predicates",
    "quail.execution.types -> quail.catalog.pairs",
    "quail.execution.types -> quail.catalog.tokens",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, N naming, D docstrings
# (Google style). D1xx (missing docstrings) stays off until the backlog
# of undocumented public methods is written.
select = ["E", "F", "W", "I", "N", "D"]
# N803/N806: Triton kernels take upper-case constexpr arguments and
# shape variables (H, KH, D) by convention. N812: torch.nn.functional
# is imported as F everywhere.
ignore = ["D1", "N803", "N806", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["quail", "quail_b", "bench", "calibrate", "experiments"]

# Each package imports only the packages below it. `uv run lint-imports`
# checks the contract; the one exception is the lazy import that lets
# ExtensionRegistry.with_built_ins() build the built in registry.
[tool.importlinter]
root_package = "quail"
# imports under TYPE_CHECKING carry no run-time dependency
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Packages import downward only"
type = "layers"
layers = [
    "quail.server",
    "quail.api",
    "quail.builtins",
    "quail.baselines",
    "quail.extensions",
    "quail.backends",
    "quail.remote",
    "quail.execution",
    "quail.explain",
    "quail.planner",
    "quail.physical",
    "quail.frontend",
    "quail.catalog",
    "quail.logical",
    "quail.cost",
    "quail.specs | quail.labels | quail.progress | quail.deploy",
]
ignore_imports = ["quail.extensions -> quail.builtins"]

[[tool.importlinter.contracts]]
name = "Planner stages import downward only"
type = "layers"
layers = [
    "quail.planner.pricing",
    "quail.planner.rules",
    "quail.planner.graph | quail.planner.sol",
    "quail.planner.search",
    "quail.planner.operators",
    "quail.planner.statistics",
    "quail.planner.optimize",
    "quail.planner.optimizer",
    "quail.planner.validation | quail.planner.prompt_lowering",
    "quail.planner.plan",
]

[tool.vulture]
paths = ["quail", "bench", "calibrate"]
min_confidence = 70
