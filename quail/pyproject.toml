[project]
name = "quail"
version = "0.1.0"
description = "Quail: a declarative query engine for AI_FILTER and AI_JOIN"
readme = "README.md"
# <3.13: bpe-qwen ships wheels up to 3.12, and the Modal image runs 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot>=27.0",
    "transformers>=4.48",
    "huggingface-hub>=0.26",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "modal>=1.0",
    "bpe-qwen>=0.1.5",
    "datasets>=5.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
