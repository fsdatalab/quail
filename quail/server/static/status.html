<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quail query</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 2rem auto; max-width: 64rem; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
  code, pre { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { background: #f6f6f6; padding: .75rem; overflow: auto; white-space: pre; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
  .state { display: inline-block; padding: .1rem .5rem; border-radius: .25rem; font-weight: 600; }
  .phase { font-size: 1.15rem; font-weight: 600; margin: .75rem 0; }
  .queued, .planning, .running { background: #fff3cd; }
  .succeeded { background: #d4edda; }
  .failed, .interrupted { background: #f8d7da; }
  .cancelled { background: #e2e3e5; }
  .bar { height: .5rem; background: #e5e5e5; border-radius: .25rem; overflow: hidden; margin-top: .25rem; }
  .bar > div { height: 100%; background: #2f6fdb; width: 0; }
  button { font: inherit; padding: .3rem .8rem; }
  .muted { color: #666; }
  a.file { cursor: pointer; text-decoration: underline; color: #2f6fdb; }
</style>
</head>
<body>
<h1 id="title">Quail query</h1>
<div id="view"></div>
<script>
const parts = location.pathname.split("/").filter(Boolean);
const queryId = parts[0] === "queries" ? parts[1] : null;
const view = document.getElementById("view");
const DONE = ["succeeded", "failed", "interrupted", "cancelled"];
const TOKEN_KEY = "quail-server-token";

// The /v1 routes need the server's bearer token when one is set. A link
// may carry it as "#token=..." once; it is then kept in this browser
// and removed from the address bar. Without one, the first 401 asks.
function readToken() {
  const match = location.hash.match(/token=([^&]+)/);
  if (match) {
    localStorage.setItem(TOKEN_KEY, decodeURIComponent(match[1]));
    history.replaceState(null, "", location.pathname + location.search);
  }
  return localStorage.getItem(TOKEN_KEY) || "";
}
let token = readToken();

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (token) headers["authorization"] = "Bearer " + token;
  let response = await fetch(path, { ...options, headers });
  if (response.status === 401) {
    const entered = prompt("This Quail Server needs a token.");
    if (entered === null) return response;
    token = entered.trim();
    localStorage.setItem(TOKEN_KEY, token);
    headers["authorization"] = "Bearer " + token;
    response = await fetch(path, { ...options, headers });
  }
  return response;
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "onclick") node.onclick = value; else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function when(seconds) {
  return seconds ? new Date(seconds * 1000).toLocaleString() : "";
}

// Plain links cannot send the token, so files are fetched and saved.
function fileLink(path, filename) {
  return el("a", { class: "file", onclick: async () => {
    const response = await api(path);
    if (!response.ok) { alert(`${filename}: HTTP ${response.status}`); return; }
    const url = URL.createObjectURL(await response.blob());
    const anchor = el("a", { href: url, download: filename });
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    URL.revokeObjectURL(url);
  } }, filename);
}

function renderList(items) {
  document.getElementById("title").textContent = "Recent Quail queries";
  const table = el("table", {}, el("tr", {},
    el("th", {}, "id"), el("th", {}, "status"), el("th", {}, "created"), el("th", {}, "rows")));
  for (const item of items) {
    table.append(el("tr", {},
      el("td", {}, el("a", { href: "/queries/" + item.id }, el("code", {}, item.id))),
      el("td", {}, item.phase ? item.phase.message : item.state),
      el("td", {}, when(item.created_at)),
      el("td", {}, item.result ? String(item.result.rows) : "")));
  }
  view.replaceChildren(items.length ? table : el("p", { class: "muted" }, "No queries yet."));
}

async function cancel() {
  await api(`/v1/queries/${queryId}/cancel`, { method: "POST" });
}

async function preview(status) {
  const response = await api(`/v1/queries/${queryId}/rows?limit=20`);
  if (!response.ok) return el("p", { class: "muted" }, "preview unavailable");
  const data = await response.json();
  const table = el("table", {}, el("tr", {}, ...data.columns.map(c => el("th", {}, c))));
  for (const row of data.rows) {
    table.append(el("tr", {}, ...row.map(v => el("td", {}, v === null ? "" : String(v)))));
  }
  const note = `${data.rows.length} of ${data.total_rows} rows`;
  return el("div", {}, el("p", { class: "muted" }, note), table);
}

async function renderStatus(status) {
  document.getElementById("title").textContent = "Quail query " + status.id;
  const nodes = [];
  const header = el("p", {},
    el("span", { class: "state " + status.state }, status.state),
    " ", el("span", { class: "muted" },
      `revision ${status.revision}, updated ${when(status.updated_at)}`));
  if (!DONE.includes(status.state)) {
    header.append(" ", el("button", { onclick: cancel },
      status.cancel_requested ? "cancel requested" : "Cancel"));
  }
  nodes.push(header);
  if (status.phase) {
    nodes.push(el("p", { class: "phase" }, status.phase.message));
  }
  nodes.push(el("p", { class: "muted" },
    `model ${status.config.model} on ${status.config.device} ` +
    `(${status.config.gpus} GPU, backend ${status.config.backend}), ` +
    `timeout ${status.timeout_s} s, created ${when(status.created_at)}` +
    (status.started_at ? `, started ${when(status.started_at)}` : "") +
    (status.session_id ? `, session ${status.session_id}` : "")));
  if (status.progress && status.progress.label) {
    const p = status.progress;
    const text = p.total ? `${p.done.toLocaleString()} / ${p.total.toLocaleString()} ${p.unit}`
                         : `${p.done.toLocaleString()} ${p.unit}`;
    const bar = el("div", { class: "bar" }, el("div", { style: p.total ? `width:${100 * p.done / p.total}%` : "width:0" }));
    nodes.push(el("h2", {}, "Progress"),
      el("p", {}, `${p.label}: ${text} `, el("span", { class: "muted" }, `as of ${when(p.recorded_at)}`)), bar);
  }
  if (status.progress && status.progress.answers_saved) {
    nodes.push(el("p", {}, `${status.progress.answers_saved.toLocaleString()} answer batches saved so far · `,
      fileLink(`/v1/queries/${status.id}/answers?limit=10000`, "answers.json")));
  }
  if (status.error) {
    nodes.push(el("h2", {}, "Error"), el("pre", {}, `${status.error.type}: ${status.error.message}`));
  }
  if (status.result) {
    nodes.push(el("h2", {}, `Result: ${status.result.rows.toLocaleString()} rows`),
      el("p", {},
        fileLink(`/v1/queries/${status.id}/result`, "result.arrows"), " · ",
        fileLink(`/v1/queries/${status.id}/files/report.json`, "report.json")),
      await preview(status));
  }
  if (status.plan) {
    nodes.push(el("h2", {}, "Plan"), el("pre", {}, status.plan.text));
  }
  nodes.push(el("h2", {}, "SQL"), el("pre", {}, status.spec.sql));
  nodes.push(el("h2", {}, "Inputs"), el("pre", {}, JSON.stringify(status.inputs, null, 2)));
  view.replaceChildren(...nodes);
}

// Read server-sent events with fetch, which can send the token; the
// browser's EventSource cannot. Returns the last status seen.
async function readEvents(afterRevision, onStatus) {
  const response = await api(`/v1/queries/${queryId}/events`,
    { headers: { "last-event-id": String(afterRevision) } });
  if (!response.ok) throw new Error(`events: HTTP ${response.status}`);
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffered = "";
  let last = null;
  while (true) {
    const { value, done } = await reader.read();
    if (done) return last;
    buffered += decoder.decode(value, { stream: true });
    let end;
    while ((end = buffered.indexOf("\n\n")) >= 0) {
      const message = buffered.slice(0, end);
      buffered = buffered.slice(end + 2);
      for (const line of message.split("\n")) {
        if (line.startsWith("data: ")) {
          last = JSON.parse(line.slice(6));
          await onStatus(last);
        }
      }
    }
  }
}

async function main() {
  if (!queryId) {
    const response = await api("/v1/queries?limit=100");
    if (!response.ok) { view.replaceChildren(el("p", {}, `HTTP ${response.status}`)); return; }
    renderList((await response.json()).queries);
    return;
  }
  const response = await api(`/v1/queries/${queryId}`);
  if (!response.ok) {
    view.replaceChildren(el("p", {}, `No query ${queryId} (${response.status}).`));
    return;
  }
  let status = await response.json();
  await renderStatus(status);
  while (!DONE.includes(status.state)) {
    try {
      const last = await readEvents(status.revision, async (next) => {
        status = next;
        await renderStatus(status);
      });
      if (last === null && !DONE.includes(status.state)) {
        // the stream closed without an event; fetch the snapshot and go on
        const again = await api(`/v1/queries/${queryId}`);
        if (again.ok) { status = await again.json(); await renderStatus(status); }
      }
    } catch (error) {
      await new Promise(resolve => setTimeout(resolve, 2000));
    }
  }
}

main();
</script>
</body>
</html>
